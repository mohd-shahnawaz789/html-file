<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
</head>
<body>
<label for="firstname">First Name:</label>
<input type="text" id="firstname" name="firstname" placeholder="eg.shahnawaz" required>
<br><br>
<label for="lastname">Last Name:</label>
<input type="text" id="lastname" name="lastname" placeholder="eg.shaikh" required>
<br><br>
<label for="dateofbirth">Date of Birth:</label>
<input type="date" id="dateofbirth" name="dateofbirth" placeholder="date month year" required> 
<br><br>
<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="eg.shahnawaz@gmail.com" required>
<br><br>
<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required>
<br><br>
<label for="mobile">Mobile Number:</label>
<input type="tel" id="mobile" name="mobile" placeholder="eg.1234567890" required>
<br><br>
<label for="male">Male:</label>
<input type="radio" id="male" name="gender" value="male" required>
<label for="female">Female:</label>
<input type="radio" id="female" name="gender" value="female" required>
<label for="other">Other:</label>
<input type="radio" id="other" name="gender" value="other" required>
<br><br>
<label for="upload picture">Upload Picture:</label>
<input type="file" id="upload picture" name="upload picture" accept="image/*" required>
<br> <br>
<button type="submit">Register</button>
<button type="reset">Reset</button>



</body>
</html>
